# 导航控制参数
navigation:
  # 角速度 PD 增益（控制朝向标签的旋转修正）
  kp_angular: 1.5       # 比例增益  [rad/s / m 横向误差]
  kd_angular: 0.1       # 微分增益

  # 线速度 PD 增益（控制向标签靠近的前进速度）
  kp_linear: 0.6        # 比例增益  [m/s / m 距离误差]
  kd_linear: 0.05       # 微分增益

  # 目标停靠距离（与标签的距离）[米]
  target_distance: 0.30

  # 距离误差小于此阈值时认为已到达目标
  arrival_threshold: 0.05   # [米]

  # 最大允许速度（安全限制）
  max_linear_vel: 0.5       # [m/s]
  max_angular_vel: 1.2      # [rad/s]

  # 仅旋转对齐阶段：横向偏移超过此阈值时先原地旋转
  align_threshold: 0.15   # [米]

  # 未检测到标签时的搜索旋转速度
  search_angular_vel: 0.4   # [rad/s]

  # 速度指令发布频率 [Hz]
  cmd_rate: 20

# 目标 AprilTag ID 列表（每个目标区域一个）。
# 导航器将尝试到达此列表中第一个可见的标签。
target_tag_ids: [0, 1, 2, 3]

# 连接 STM32 的串口（可通过 launch 参数覆盖）
serial:
  port: /dev/ttyUSB0
  baudrate: 115200
